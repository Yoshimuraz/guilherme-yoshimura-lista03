<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comentários por Post</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    select {
      padding: 8px;
      min-width: 250px;
    }

    .comentario {
      border: 1px solid gray;
      padding: 8px 16px;
      margin-bottom: 12px;
      max-width: 600px;
    }
  </style>
</head>
<body>
  <h1>Comentários por Post</h1>

  <label for="post">Selecione um post:</label><br><br>
  <select id="post"></select>

  <div id="areaComentarios"></div>

  <script>
    const posts = [
      { id: 1, title: "Introdução ao DOM" },
      { id: 2, title: "Eventos em JavaScript" },
      { id: 3, title: "O que é uma API?" }
    ];

    const comentarios = [
      { postId: 1, id: 1, name: "Ana", email: "ana@email.com", body: "Explicação muito clara!" },
      { postId: 1, id: 2, name: "Bruno", email: "bruno@email.com", body: "Gostei do exemplo do getElementById." },
      { postId: 2, id: 3, name: "Carla", email: "carla@email.com", body: "addEventListener é bem melhor que onclick." },
      { postId: 3, id: 4, name: "Diego", email: "diego@email.com", body: "A analogia do garçom ajudou muito." },
      { postId: 3, id: 5, name: "Elisa", email: "elisa@email.com", body: "Quero testar o JSONPlaceholder!" },
      { postId: 3, id: 6, name: "Fábio", email: "fabio@email.com", body: "E o método POST, como funciona?" }
    ];

    const select = document.getElementById("post");
    const area = document.getElementById("areaComentarios");

    // Gera as opções via JavaScript
    const opcaoInicial = document.createElement("option");
    opcaoInicial.value = "";
    opcaoInicial.textContent = "Selecione um post";
    select.appendChild(opcaoInicial);

    for (const post of posts) {
      const opcao = document.createElement("option");
      opcao.value = post.id;
      opcao.textContent = post.title;
      select.appendChild(opcao);
    }

    // Exibe somente os comentários do post escolhido
    select.addEventListener("change", function () {
      area.innerHTML = "";

      if (select.value === "") return; // área vazia

      const doPost = comentarios.filter(c => c.postId === Number(select.value));

      const titulo = document.createElement("h2");
      titulo.textContent = `Comentários (${doPost.length})`;
      area.appendChild(titulo);

      for (const c of doPost) {
        const card = document.createElement("div");
        card.className = "comentario";

        const nome = document.createElement("h3");
        nome.textContent = c.name;

        const email = document.createElement("p");
        email.textContent = `E-mail: ${c.email}`;

        const texto = document.createElement("p");
        texto.textContent = c.body;

        card.append(nome, email, texto);
        area.appendChild(card);
      }
    });
  </script>
</body>
</html>
